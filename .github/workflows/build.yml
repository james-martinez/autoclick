name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install MinGW-w64
      run: sudo apt-get update && sudo apt-get install -y mingw-w64

    - name: Build
      run: make CC=x86_64-w64-mingw32-g++ WINDRES=x86_64-w64-mingw32-windres LDFLAGS="-static -luser32 -lkernel32 -lwinmm -lstdc++"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: auto_clicker
        path: auto_clicker.exe
